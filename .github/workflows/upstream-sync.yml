name: Upstream sync PR

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-pr
  cancel-in-progress: false

jobs:
  validate-repositories:
    name: Validate fork and upstream repositories
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    outputs:
      fork_default: ${{ steps.repository.outputs.fork_default }}
      upstream_default: ${{ steps.repository.outputs.upstream_default }}
      upstream_repository: ${{ steps.repository.outputs.upstream_repository }}
    steps:
      - name: Validate repository identities and resolve branches
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$GITHUB_REPOSITORY" = 'stoneymarrow/firstmate' ] || {
            echo "::error::writable repository must be stoneymarrow/firstmate"
            exit 1
          }
          fork_default=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          upstream_repository=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.source.full_name // .parent.full_name // empty')
          [ "$upstream_repository" = 'kunchenguid/firstmate' ] || {
            echo "::error::fetch-only upstream must be kunchenguid/firstmate"
            exit 1
          }
          upstream_default=$(gh api "repos/$upstream_repository" --jq '.default_branch')
          {
            echo "fork_default=$fork_default"
            echo "upstream_repository=$upstream_repository"
            echo "upstream_default=$upstream_default"
          } >> "$GITHUB_OUTPUT"

  sync:
    name: Open or refresh upstream sync PR
    needs: validate-repositories
    if: >-
      needs.validate-repositories.outputs.upstream_repository == 'kunchenguid/firstmate'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-repositories.outputs.fork_default }}

      - name: Configure fetch-only upstream
        env:
          FM_SYNC_UPSTREAM_REPOSITORY: ${{ needs.validate-repositories.outputs.upstream_repository }}
        run: |
          set -eu
          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream "https://github.com/$FM_SYNC_UPSTREAM_REPOSITORY.git"
          git remote set-url --push upstream DISABLED

      - name: Prepare fork-only review branch
        id: prepare
        env:
          FM_SYNC_BASE_BRANCH: ${{ needs.validate-repositories.outputs.fork_default }}
          FM_SYNC_UPSTREAM_BRANCH: ${{ needs.validate-repositories.outputs.upstream_default }}
          FM_SYNC_BRANCH: automation/upstream-sync
        run: bin/fm-upstream-sync.sh prepare

      - name: Open or refresh review PR
        if: steps.prepare.outputs.has_delta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FM_SYNC_REPOSITORY: stoneymarrow/firstmate
          FM_SYNC_BASE_BRANCH: ${{ needs.validate-repositories.outputs.fork_default }}
          FM_SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
          FM_SYNC_BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          FM_SYNC_UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
          FM_SYNC_UPSTREAM_REPOSITORY: kunchenguid/firstmate
          FM_SYNC_CONFLICT: ${{ steps.prepare.outputs.conflict }}
        run: bin/fm-upstream-sync.sh upsert-pr
